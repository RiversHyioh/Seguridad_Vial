<script>

t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

 init(){ if(this.c)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;

  const rg=c.createGain(); rg.gain.value=0; n.connect(bf); bf.connect(rg); rg.connect(this.m); n.start(); this.rg=rg;
  }catch(e){this.c=null;}
 },

 if(W.view==='moto'&&n>.15){ g=ctx.createRadialGradient(CW/2+W.sway,CH*.82,0,CW/2+W.sway,CH*.7,CH*.55);
  g.addColorStop(0,'rgba(255,240,200,'+(.22*n)+')'); g.addColorStop(1,'rgba(255,240,200,0)'); ctx.fillStyle=g; ctx.fillRect(0,HOR,CW,CH-HOR); }
 const items=[];
 for(let z=28-(W.dist%28);z<230;z+=28){ items.push([z,()=>drawPole(2.75,z)]); const z2=z+14; items.push([z2,()=>drawPole(-6.3,z2)]); }
 if(W.sign) items.push([W.sign.z,()=>drawSign(W.sign)]);
 if(W.light) items.push([W.light.z,()=>drawLight(W.light)]);

 if(W.cross){ const c=W.cross; items.push([c.z,()=>{ const b=P(c.x,c.z); if(b.y<HOR)return; const s=b.s,w=4.3*s,h=1.35*s;

/* ================= ACTUALIZACIÓN ================= */
function approach(v,tgt,up,down,dt){ return v<tgt?Math.min(tgt,v+up*dt):Math.max(tgt,v-down*dt); }
let ambNext=2;
function update(dt,t){
 W.tod=approach(W.tod,W.todT,.06,.06,dt); W.rain=approach(W.rain,W.rainT,.35,.25,dt);
 W.wet=approach(W.wet,G.wet===2?1:(G.wet===1?.6:0),.3,.2,dt);
 W.camX=approach(W.camX,W.camXT,W.camRate,W.camRate,dt);
 W.black=approach(W.black,W.blackT,1.2,1.2,dt);
 if(!(T.on&&T.phase==='run')) W.speed=approach(W.speed,W.target,9,16,dt);
 const v=W.speed/3.6;
 if(T.on) testStep(dt);
 W.dist+=v*dt;
 const mv=v*dt;
 if(W.sign){W.sign.z-=mv; if(W.sign.z<1)W.sign=null;}
 if(W.light){W.light.z-=mv; if(W.light.z<1)W.light=null;}
 if(W.bus){W.bus.z+=(W.bus.v||0)*dt-mv; if(W.bus.z<1||W.bus.z>260)W.bus=null;}
 if(W.cross){W.cross.x+=W.cross.dir*W.cross.v*dt; W.cross.z-=mv; if(Math.abs(W.cross.x)>14)W.cross=null;}
 if(W.hazard&&!T.on){ const h=W.hazard; h.z-=mv+(h.v||0)*dt; if(h.z<-3)W.hazard=null; }
 W.amb.forEach(a=>a.z-=mv+a.v*dt); W.amb=W.amb.filter(a=>a.z>.8);
 ambNext-=dt; if(W.ambOn&&ambNext<=0&&W.amb.length<2){ W.amb.push({z:170,X:-3.5,v:9+Math.random()*6,c:[[90,96,110],[160,160,165],[40,70,120],[120,30,35]][Math.random()*4|0]}); ambNext=2.5+Math.random()*4; }
 const rs=1+W.speed/50; DROPS.forEach(d=>{d.y+=d.v*dt*1.6*rs; d.x-=.02*dt*rs; if(d.y>1.1){d.y=-.1;d.x=Math.random()*1.2-.1;}});
 W.shake=Math.max(0,W.shake-dt*1.6); W.flash=Math.max(0,W.flash-dt*1.1);
 W.sway=W.view==='moto'?Math.sin(t*1.3)*CW*.006*clamp(W.speed/50,0,1.6):0;
 if(W.mode==='walk'&&W.speed>.5){ W.bob=Math.sin(t*(W.speed>7?13:8))*CH*(W.speed>7?.012:.007); } else W.bob=approach(W.bob,0,CH*.05,CH*.05,dt);
 AU.engine(W.speed,W.view==='bus'?'bus':(W.view==='moto'?'moto':'walk'));
 hudSpeed(t); }

let last=0;
function frame(now){ const t=now/1000,dt=Math.min(.05,last?t-last:0); last=t; update(dt,t); render(t); requestAnimationFrame(frame); }

function testStep(dt){
 if(T.done&&T.phase!=='run')return;
 if(T.kind==='moto'){
  if(T.phase==='wait'){ T.t+=dt; if(T.t>=T.spawn){ T.phase='run'; T.e=0; T.v=W.speed/3.6; T.v0=T.v;
    W.hazard={kind:'rear',X:0,z:42}; AU.screech(.5); if(G.phone) openModal(); const bk=$('#bk'); if(bk)bk.classList.remove('idle'); } return; }
  if(T.phase!=='run')return; T.e+=dt;
  if(T.brakeAt===null){ if(T.tap!==null) T.brakeAt=T.tap+.25; else if(T.e>=T.auto){ T.brakeAt=T.e; T.alone=true; } }
  const br=T.brakeAt!==null&&T.e>=T.brakeAt;
  if(br&&!T.snd){ T.snd=true; T.vb=T.v; AU.screech(1); }
  if(br) T.v=Math.max(0,T.v-T.a*dt);
  const ds=T.v*dt; if(br)T.brk+=ds; else T.react+=ds;
  W.hazard.z-=ds; W.speed=T.v*3.6; W.target=W.speed;
  if(W.hazard.z<=2.1&&T.v>.15){ endTest(true,T.v*3.6); }
  else if(T.v<=0){ endTest(false,0); }
 } else {
  if(T.phase==='wait'){ T.t+=dt; if(T.t>=T.spawn){ T.phase='run'; T.e=0;
    W.hazard={kind:'front',X:-.3,z:T.z0,v:12.5}; T.v0=12.5;
    if(G.audif){ AU.horn(); } else { AU.horn(); banner('¡PIIIII!','#ffd166',700); }
    if(G.phone) openModal(); const bk=$('#bk'); if(bk)bk.classList.remove('idle'); } return; }
  if(T.phase!=='run')return; T.e+=dt; const h=W.hazard;
  if(T.e>=.9) h.v=Math.max(0,h.v-T.a*dt);
  h.z-=h.v*dt;
  if(T.tap!==null&&!T.esc){ T.esc=true; W.camXT=3.6; W.camRate=11; }
  const safe=T.tap!==null&&T.e>=T.tap+.35;
  if(!T.done){
   if(safe){ T.safeAt=T.e; endTest(false,0); }
   else if(h.z<=2.1&&h.v>.15){ endTest(true,h.v*3.6); }
   else if(h.v<=0){ T.stopped=true; endTest(false,0); } }
  else if(h.z<-3){ W.hazard=null; T.phase='over'; }
 } }
function endTest(impact,vImp){ if(T.done)return; T.done=true; KEY=null; closeModal(true);
 const bk=$('#bk'); if(bk){ bk.disabled=true; bk.style.opacity=.5; }
 G.res={kind:T.kind,impact,vImp:Math.round(vImp),tap:T.tap,alone:T.alone,a:T.a,v0:T.v0,vb:T.vb||T.v0,react:T.react,brk:T.brk,
  z0:T.z0,e:T.e,stopped:!!T.stopped,cross:G.cross,gap:W.hazard?Math.max(0,W.hazard.z-2.1):0};
 if(impact){ AU.crash(); W.flash=1; W.shake=1.2; W.target=0; W.speed=0; W.blackT=.25; T.phase='over';
  if(T.kind==='moto') W.hazard.z=2.1; else { W.hazard.v=0; }
 } else if(T.kind==='moto'){ T.phase='over'; W.target=0; }
 else { AU.whoosh(); }
 later(()=>{ T.on=false; testResult(); },impact?1700:1500); }

/* ---------- PRUEBA PEATÓN ---------- */
function testBus(){ G.step=5; hud(); W.todT=.8; W.mode='stand'; W.target=0; W.camXT=.2; W.camRate=1.2;
 if(G.cross!=='behind') W.bus=null;
 let z0=G.cross==='cebra'?34:(G.cross==='wait'?22:12); if(G.audif) z0-=5;
 show('<div class="step">Paso 5 de 6 · Prueba de reacción</div><h2>Vas cruzando la avenida.</h2>'+
 '<p>Si aparece un carro, <b>devuélvete al andén</b>: toca el botón o la barra espaciadora. Devolverte toma un tercio de segundo.</p>'+
 '<button class="brake blue idle" id="bk">¡AL ANDÉN!</button><div class="hint">No toques antes de tiempo: si te devuelves sin motivo te quedas más tiempo en la vía.</div>');
 const bk=$('#bk'); const hit=()=>{ bk.classList.add('hit'); setTimeout(()=>bk.classList.remove('hit'),120); tap(); };
 bk.addEventListener('pointerdown',e=>{ e.preventDefault(); hit(); });
 KEY=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); hit(); } };
 Object.keys(T).forEach(k=>delete T[k]); Object.assign(T,{on:true,kind:'bus',phase:'wait',t:0,spawn:1.6+Math.random()*2.2,tap:null,z0:z0,a:G.wet===2?3:(G.wet===1?4:5),
  esc:false,done:false,stopped:false});
 scrollStage(); }

/* ---------- MODAL CELULAR ---------- */
function openModal(){ AU.ping(); $('#modal').classList.add('on'); T.modalAt=T.e||0; }

$('#mClose').addEventListener('click',()=>closeModal());

/* ---------- RESULTADO DE LA PRUEBA ---------- */
function testResult(){ const r=G.res; let d=0,title,body,cls;
 if(r.kind==='moto'){
  const ms=r.tap!==null?Math.round(r.tap*1000):null; r.ms=ms;
  r.need=r.react+(r.vb*r.vb)/(2*r.a); r.avail=42-2.1;
  if(r.impact){ cls='bad'; title='No alcanzó a frenar.'; body=(r.alone?'No le avisaste a tiempo y Juan reaccionó solo, tarde. ':'Le avisaste, pero ')+'la moto necesitaba '+r.need.toFixed(1)+' metros para detenerse y solo había '+r.avail.toFixed(0)+'. El impacto fue a '+r.vImp+' km/h.'; }
  else if(r.alone){ d=-10; cls='mid'; title='Juan frenó solo. Por poco.'; body='No alcanzaste a avisarle: Juan vio el carro por su cuenta, tarde, y quedaron a '+r.gap.toFixed(1)+' metros. Esta vez alcanzó. Fue suerte, no margen.'; }
  else { d=ms<500?5:0; cls=d>0?'good':'mid'; title='Frenaron a tiempo.'; body='Le gritaste a los '+ms+' ms y Juan alcanzó a detener la moto a '+r.gap.toFixed(1)+' metros del carro. Tu atención como copiloto hizo la diferencia.'; }
 } else {
  const ms=r.tap!==null?Math.round(r.tap*1000):null; r.ms=ms; r.avail=Math.max(.1,(r.z0-2.1)/12.5); r.used=ms!==null?ms/1000+.35:null;
  if(r.impact){ cls='bad'; title='No alcanzaste a devolverte.'; body=(ms===null?'No reaccionaste. ':'Reaccionaste a los '+ms+' ms, ')+'pero el carro apareció a solo '+r.z0+' metros. El impacto fue a '+r.vImp+' km/h.'; }
  else if(r.stopped&&ms===null){ d=5; cls='good'; title='El conductor alcanzó a frenar.'; body='Estabas en la cebra y el conductor esperaba encontrarte ahí: frenó a tiempo. Eso es lo que compra cruzar por donde corresponde.'; }
  else { d=ms<450?5:0; cls=d>0?'good':'mid'; title='Llegaste al andén.'; body='Te devolviste a los '+ms+' ms y el carro pasó de largo. '+(r.z0<=17?'Apareció muy cerca: un poco más lento y no la cuentas.':'Tenías algo de distancia a tu favor.'); }
 }
 if(d){ addMargin(d); }
 G.log.push({t:'Prueba de reacción: '+(r.impact?'impacto a '+r.vImp+' km/h':(r.ms!==null?r.ms+' ms':'sin reacción')),d:d});
 G.res.title=title;
 show('<div class="step">Paso 5 de 6 · Resultado de la prueba</div><h2>'+esc(title)+'</h2><div class="fb '+cls+'" style="margin-top:4px">'+esc(body)+'</div>'+
  '<button class="btn" id="nx">'+(r.impact?'Ver cómo terminó →':'Seguir →')+'</button>');
 const nx=$('#nx'); nx.onclick=()=>{ KEY=null; nx.disabled=true; if(r.impact) ending(); else (G.route==='moto'?d6moto:d6bus)(); };
 KEY=e=>{ if(e.key==='Enter'){ e.preventDefault(); nx.click(); } }; scrollPanel(); }

const ENDS={
 llegaste:{t:'LLEGASTE.',c:'#3ecf8e',x:m=>'Llegaste a tu casa sin una sola situación de riesgo real. No fue suerte: en cada punto del trayecto conservaste tu margen. Cuando se hace bien no pasa nada, y nadie se entera. Esa es exactamente la idea.'},

 hospital:{t:'LLEGASTE… A URGENCIAS.',c:'#ff5c4d',x:()=>(G.route==='moto'?'El casco hizo su trabajo: hoy estás en urgencias y no en otro lugar. Pero el casco no evitó el choque. Lo evitaban las decisiones de antes.':'Hoy estás en urgencias. Vas a recuperarte, pero vas a perder meses. Todo se decidió en los minutos anteriores, no en el segundo del impacto.')},
 nollegaste:{t:'NO LLEGASTE.',c:'#ff5c4d',x:()=>'Esa noche en tu casa no se sentaron a comer: recibieron una llamada. No hubo una sola decisión que lo causara. Hubo varias, y cada una por separado parecía pequeña. Así es como pasa en la vida real: nunca es una sola.'}};
function ending(){ clearTimers(); KEY=null; T.on=false; G.step=6; hud(); const r=G.res||{}; let k;
 if(r.impact){ if(G.route==='moto'){ k=r.vImp<20?'golpe':(G.youHelmet&&r.vImp<55?'hospital':'nollegaste'); }
  else { k=r.vImp<18?'golpe':(r.vImp<32?'hospital':'nollegaste'); } }
 else k=G.margin>=80?'llegaste':(G.margin>=50?'susto':'casi');
 G.endKey=k; const E=ENDS[k];
 if(k==='llegaste'||k==='susto'||k==='casi'){ W.target=0; banner(E.t,E.c,2600); if(k==='llegaste')AU.ok(); }
 else { W.blackT=k==='nollegaste'?.88:.6; banner(E.t,E.c); }
 AU.rain(0); W.rainT=Math.min(W.rainT,.25);
 let h='<div class="ending" style="border-color:'+E.c+';background:'+(k==='llegaste'?'#10322a':(k==='susto'||k==='casi'||k==='golpe'?'#33290f':'#36191a'))+'">'+
  '<div class="dim" style="font-size:13px">'+esc(G.name)+', tu trayecto terminó así</div><div class="big" style="color:'+E.c+'">'+E.t+'</div><p>'+esc(E.x(G.margin))+'</p></div>';
 h+='<div class="stats"><div><b>'+G.margin+'%</b><span>margen final</span></div>'+
  '<div><b>'+(r.ms!==null&&r.ms!==undefined?r.ms+' ms':'—')+'</b><span>tu reacción</span></div>'+
  '<div><b>'+(r.kind==='moto'?Math.round((r.v0||0)*3.6)+' km/h':(r.z0?r.z0+' m':'—'))+'</b><span>'+(r.kind==='moto'?'velocidad al ver el peligro':'distancia del carro al aparecer')+'</span></div></div>';
 if(r.kind==='moto'&&r.need){ const mx=Math.max(r.need,r.avail)*1.08,re=r.react,bk=r.need-r.react;
  h+='<div class="sec-t">Lo que pasó en la frenada</div><div class="diag"><div class="t"><span>Necesitabas '+r.need.toFixed(1)+' m</span><span>Tenías '+r.avail.toFixed(0)+' m</span></div>'+
   '<div class="track"><i style="background:#f5c518" data-w="'+(re/mx*100)+'"></i><i style="background:'+(r.need>r.avail?'#ff5c4d':'#3ecf8e')+'" data-w="'+(bk/mx*100)+'"></i>'+
   '<span class="lim" style="left:calc('+(r.avail/mx*100)+'% - 1px)"></span></div>'+
   '<div class="legend"><span style="--c:#f5c518">Antes de frenar: '+re.toFixed(1)+' m</span><span style="--c:'+(r.need>r.avail?'#ff5c4d':'#3ecf8e')+'">Frenando ('+(G.wet===2?'piso mojado':(G.wet===1?'piso húmedo':'piso seco'))+'): '+bk.toFixed(1)+' m</span><span style="--c:#fff">Carro detenido</span></div></div>'; }
 else if(r.kind==='bus'&&r.avail){ const used=r.used!==null?r.used:r.avail*1.15,mx=Math.max(used,r.avail)*1.1;
  h+='<div class="sec-t">Lo que pasó en el cruce</div><div class="diag"><div class="t"><span>Usaste '+(r.used!==null?r.used.toFixed(2)+' s':'—')+'</span><span>Tenías '+r.avail.toFixed(2)+' s</span></div>'+
   '<div class="track"><i style="background:'+(r.impact?'#ff5c4d':'#3ecf8e')+'" data-w="'+(used/mx*100)+'"></i><span class="lim" style="left:calc('+(r.avail/mx*100)+'% - 1px)"></span></div>'+
   '<div class="legend"><span style="--c:'+(r.impact?'#ff5c4d':'#3ecf8e')+'">Tu reacción + devolverte</span><span style="--c:#fff">Momento en que el carro llega</span></div></div>'; }
 h+='<div class="sec-t">Tus decisiones</div>'+G.log.map(l=>'<p class="log '+(l.d<0?(l.d<=-20?'r':'m'):(l.d>0?'g':''))+'">'+esc(l.t)+(l.d?' <em>('+(l.d>0?'+':'')+l.d+'%)</em>':'')+'</p>').join('')+
  '<p class="dim" style="margin-top:10px">Ninguna de estas decisiones te pareció grave cuando la tomaste. Ese es el punto.</p>';
 h+='<div class="sec-t">El mensaje</div><div class="bigmsg">Un segundo de distracción no se devuelve. En la vía, el que decide bien, llega.</div>'+
  '<button class="btn" id="cie">Aprendizaje →</button>'+

 {n:2,t:'Zona escolar: 30 no es "más o menos 30"',
  r:'30 km/h en zonas escolares, residenciales, hospitalarias e intersecciones. 50 km/h en vías urbanas. Ley 2251 de 2022 (Ley Julián Esteban), que modificó el artículo 106 del Código Nacional de Tránsito.',

 {i:'\u{1FA96}',t:'Decide antes de subirte',d:'Casco, quién maneja, por dónde van. Parado es fácil decir que no; a 60 km/h ya no se puede decir nada.'},

function distHTML(){
 const g=9.81, tr=1.0, VS=[[30,'Zona escolar y residencial'],[50,'Vía urbana'],[60,'"Iba apenas un poquito más rápido"']];
 const rows=[]; let mx=0;
 for(let i=0;i<VS.length;i++){ const ms=VS[i][0]/3.6, re=ms*tr, bs=ms*ms/(2*.7*g), bw=ms*ms/(2*.4*g);
  rows.push({v:VS[i][0],sub:VS[i][1],re:re,bs:bs,bw:bw,ts:re+bs,tw:re+bw}); if(re+bw>mx)mx=re+bw; }
 mx*=1.02;
 const f=n=>n.toFixed(1).replace('.',',')+' m', pc=n=>(n/mx*100);
 let h='<div class="dist">';
 for(let i=0;i<rows.length;i++){ const r=rows[i];
  h+='<div class="r"><div class="rh"><span>'+r.v+' km/h</span><i>'+r.sub+'</i></div><div class="bars">'+
   '<div class="bl"><span class="t">Seco</span><span class="bw"><i style="background:#f5c518" data-w="'+pc(r.re)+'"></i><i style="background:#3ecf8e" data-w="'+pc(r.bs)+'"></i></span><em>'+f(r.ts)+'</em></div>'+
   '<div class="bl"><span class="t">Mojado</span><span class="bw"><i style="background:#f5c518" data-w="'+pc(r.re)+'"></i><i style="background:#ff5c4d" data-w="'+pc(r.bw)+'"></i></span><em>'+f(r.tw)+'</em></div>'+
   '</div></div>'; }
 h+='</div><div class="legend"><span style="--c:#f5c518">Mientras reaccionas (1 s): el vehículo no ha frenado nada</span><span style="--c:#3ecf8e">Frenando en seco</span><span style="--c:#ff5c4d">Frenando en mojado</span></div>';
 return h;
}

 const b=$('#cie');
 if($('#cieCard')){ scrollPanel($('#cieCard')); return; }
 if(b){ b.textContent='Cierre de la campaña ↓'; b.classList.add('sec'); }
 let h='<div class="step">Aprendizaje</div><h2>Lo que deja el trayecto</h2>'+
  '<div class="cie-top">Hasta aquí se juega solo. Esta parte se habla: son unos 10 minutos y es donde el juego se vuelve aprendizaje. Nadie tuvo mala suerte en el trayecto. Hubo seis decisiones, y cada una tenía una regla detrás.</div>';

 h+='<div class="sec-t">Las seis decisiones, una por una</div>';
 for(let i=0;i<PASOS.length;i++){ const p=PASOS[i];
  h+='<details class="ac"><summary><span class="n">'+p.n+'</span><span>'+p.t+'</span></summary><div class="acb">'+
   '<span class="rule">La regla</span><p>'+p.r+'</p><span class="rule">Por qué importa</span>'+
   p.b.map(x=>'<p>'+x+'</p>').join('')+'</div></details>'; }

 h+='<div class="sec-t">La cuenta que nadie hace</div>'+
  '<p>Esto es lo que recorre un vehículo entre el momento en que aparece el peligro y el momento en que queda quieto. No depende del valor de nadie: depende de la velocidad y del piso.</p>'+
  distHTML()+
  '<p class="dim" style="margin-top:10px">A 60 km/h con piso mojado se necesitan más de 50 metros: casi una cuadra entera. Eso es lo que hay entre "alcancé a frenar" y "no alcancé".</p>';

 h+='<div class="sec-t">Cinco cosas que se pueden hacer desde mañana</div><div class="tipg">'+
  CONSEJOS.map(c=>'<div class="tip"><span class="ic">'+c.i+'</span><span><b>'+c.t+'</b><span>'+c.d+'</span></span></div>').join('')+'</div>';

 h+='<div class="sec-t">Esto no es un juego: pasa en Colombia</div>'+

  '<div><b>22%</b><span>son peatones: gente que iba caminando</span></div>'+
  '<div><b>49%</b><span>de los motociclistas fallecidos tenía entre 15 y 34 años</span></div></div>'+

 h+='<div class="sec-t">Para discutir en voz alta</div><ol class="qs">'+PREGUNTAS.map(q=>'<li>'+q+'</li>').join('')+'</ol>';

 h+='<div class="sec-t">Mi compromiso</div><p>Marca solo lo que de verdad vas a cumplir. Uno cumplido vale más que cinco escritos.</p><div class="pact">'+
  PACTO.map((p,i)=>'<label class="pk" data-i="'+i+'"><input type="checkbox"><span>'+p+'</span></label>').join('')+'</div>'+
  '<button class="btn" id="firm" disabled>Firmar mi compromiso</button><div id="fbox"></div>';

 h+='<div class="sec-t">Para quien dirige la actividad</div><details class="ac"><summary><span class="n">\u{1F3AF}</span><span>Guía rápida de la sesión (25 a 30 minutos)</span></summary><div class="acb"><div class="guide">'+
  '<div class="g"><b>Objetivo</b>Que el participante entienda que un siniestro vial no es un accidente repentino, sino el resultado de varias decisiones pequeñas que se pueden reconocer y cambiar a tiempo.</div>'+
  '<div class="g"><b>Público</b>Jóvenes de 14 a 25 años, conductores nuevos, parrilleros y peatones. Funciona igual con padres de familia.</div>'+
  '<div class="g"><b>Momento 1 · Enganche (3 min)</b>Pregunta en voz alta, con la mano levantada: ¿quién se ha subido de parrillero sin casco porque era cerquita? Nadie explica nada todavía.</div>'+
  '<div class="g"><b>Momento 2 · El juego (10 min)</b>Cada uno en su celular, en silencio y sin comentar las decisiones. El silencio es parte de la actividad: así nadie copia la respuesta correcta.</div>'+
  '<div class="g"><b>Momento 3 · Comparar finales (5 min)</b>Que levanten la mano por final: quién llegó, quién llegó con susto, quién no llegó. Pregunta quién terminó con más del 80% de margen y qué hizo distinto.</div>'+
  '<div class="g"><b>Momento 4 · Cierre (8 min)</b>Las seis decisiones y la tabla de distancias, en voz alta. El dato que más pega es el de los metros, no el de los muertos.</div>'+
  '<div class="g"><b>Momento 5 · Compromiso (4 min)</b>Cada uno marca su pacto y lo comparte. Quien quiera, lo lee en voz alta.</div>'+
  '<div class="g"><b>Materiales</b>Un celular con internet por participante (o uno solo proyectado), sonido activado y el enlace del juego.</div>'+
  '<div class="g"><b>Evaluación</b>No se evalúa el final que le salió a cada uno: se evalúa la justificación. Pide que cada participante explique una decisión que cambiaría y por qué.</div>'+
  '<div class="g"><b>Variación</b>Que la segunda vuelta la hagan por la otra ruta (quien fue en moto, que se vaya en bus) y comparen qué riesgos cambian y cuáles son los mismos.</div>'+
  '</div></div></details>';

 h+='<div class="bigmsg" style="margin-top:16px">Nadie decide tener un accidente. Lo que sí decidimos es con cuánto margen llegamos a él.</div>'+
  '<div class="row2"><a class="btn wa" id="wa2" target="_blank" rel="noopener">Compartir la campaña</a><button class="btn sec" id="re2">Volver a jugar</button></div>'+
  '<div class="srcs">Fuentes de las cifras: Observatorio Nacional de Seguridad Vial, Agencia Nacional de Seguridad Vial (<a href="https://www.ansv.gov.co/es/observatorio/estad%C3%ADsticas" target="_blank" rel="noopener">ansv.gov.co</a>) y el estudio <i>Más motos, más muertes: cuatro décadas de mortalidad vial en Colombia</i>, Fundación Colombia Tiene Futuro (2026), con datos de 2025. Marco normativo: Ley 769 de 2002 y Ley 2251 de 2022. Las distancias de frenado se calculan con un tiempo de reacción de 1 segundo y coeficientes de fricción de 0,7 en seco y 0,4 en mojado.</div>';

 const d=document.createElement('div'); d.className='card'; d.id='cieCard'; d.innerHTML=h; panel.appendChild(d);
 setTimeout(()=>{ [].forEach.call(d.querySelectorAll('.bw i'),i=>i.style.width=i.dataset.w+'%'); },140);

 const ks=[].slice.call(d.querySelectorAll('.pk')), firm=d.querySelector('#firm');

  firm.disabled=n===0; firm.textContent=n===0?'Firmar mi compromiso':'Firmar mi compromiso ('+n+' de '+PACTO.length+')'; };
 ks.forEach(k=>k.querySelector('input').addEventListener('change',sync));

  if(!sel.length)return; AU.ok();
  d.querySelector('#fbox').innerHTML='<div class="fb good" style="margin-top:12px"><b>'+esc(G.name)+', este es tu compromiso</b>'+
   sel.map(s=>'✓ '+esc(s)).join('<br>')+'</div><p class="dim" style="margin-top:10px">Toma una captura de este recuadro: es tu evidencia de participación en la campaña.</p>';
  firm.textContent='Compromiso firmado ✓'; firm.disabled=true;
  scrollPanel(d.querySelector('#fbox')); };

 const url=location.href.split('#')[0];
 d.querySelector('#wa2').href='https://wa.me/?text='+encodeURIComponent('Campaña Ruta Segura: seis decisiones, un trayecto del colegio a la casa. ¿Tú llegas? '+url);
 d.querySelector('#re2').onclick=restart;
